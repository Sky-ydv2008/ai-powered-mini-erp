<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — IntelliERP Business Intelligence</title>
    <!-- PWA & App Meta -->
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="google-site-verification" content="wFPFBK0UWrFsB88mrjcFmvNk3tU7unCWm-z99Sfmfxo" />
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/forms.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: radial-gradient(circle at top, rgba(99, 102, 241, 0.15) 0%, #0b0f19 70%);
            padding: 20px;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-glow);
            backdrop-filter: var(--glass-blur);
        }
        .role-switcher-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }
        .role-pill {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .role-pill:hover, .role-pill.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 28px;">
                <div style="width: 50px; height: 50px; border-radius: 12px; background: var(--primary-gradient); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #fff; box-shadow: var(--shadow-glow); margin-bottom: 12px;">IE</div>
                <h1 style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: #fff;">IntelliERP</h1>
                <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">AI-Powered Mini ERP & Decision Intelligence</p>
            </div>

            <div style="font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-align: center;">Quick Demo Role Switcher</div>
            <div class="role-switcher-grid">
                <div class="role-pill active" onclick="setDemoCredentials('admin', 'admin123', this)">👑 ADMIN</div>
                <div class="role-pill" onclick="setDemoCredentials('manager', 'manager123', this)">📊 MANAGER</div>
                <div class="role-pill" onclick="setDemoCredentials('employee', 'employee123', this)">🛒 EMPLOYEE</div>
            </div>

            <form id="login-form" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" value="admin" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" value="admin123" required autocomplete="current-password">
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">Sign In to Workspace</button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted);">
                <span>Production-ready Spring Boot 3 + JWT Security</span>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/pwa.js"></script>
    <script>
        function setDemoCredentials(u, p, element) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            document.querySelectorAll('.role-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            try {
                await Auth.login(u, p);
                Utils.showToast('Authentication successful!', 'success');
                window.location.href = '/dashboard.html';
            } catch (err) {
                Utils.showToast('Login failed: ' + err.message, 'danger');
                btn.disabled = false;
                btn.textContent = 'Sign In to Workspace';
            }
        }
    </script>
</body>
</html>
