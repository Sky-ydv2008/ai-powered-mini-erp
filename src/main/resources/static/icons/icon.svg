<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="107" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Center Hexagon / Cube Node -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Orbital Ring -->
    <circle r="160" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 12" stroke-opacity="0.3" />
    
    <!-- Isometric Cube / Node structure -->
    <!-- Top Face -->
    <polygon points="0,-120 104,-60 0,0 -104,-60" fill="url(#cyanGrad)" opacity="0.95" />
    <!-- Left Face -->
    <polygon points="-104,-60 0,0 0,120 -104,60" fill="url(#primaryGrad)" opacity="0.85" />
    <!-- Right Face -->
    <polygon points="104,-60 0,0 0,120 104,60" fill="#4338ca" opacity="0.95" />
    
    <!-- AI Core Glowing Node -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="0" r="16" fill="#ec4899" />
    
    <!-- Orbiting Data Nodes -->
    <circle cx="-130" cy="-60" r="14" fill="#06b6d4" />
    <circle cx="130" cy="-60" r="14" fill="#8b5cf6" />
    <circle cx="0" cy="145" r="14" fill="#ec4899" />
  </g>
</svg>
