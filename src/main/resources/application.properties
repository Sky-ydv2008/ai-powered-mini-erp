spring.application.name=IntelliERP

# Server Configuration
server.port=${PORT:3000}
server.servlet.context-path=/

# Primary Datasource (H2 in-memory/file with MySQL compatibility mode for instant zero-config setup)
spring.datasource.url=jdbc:h2:file:./data/intellierp_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at /h2-console for developers)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=9a3f68dd0e16956272580a876793a388040d393ca60322ea147be1dcbfbe57493b821422ab1e263d90616b7724a6faea8e4f5012586fbefee98e54720d20d754
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=method

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Logging
logging.level.com.example.intellierp=INFO
logging.level.org.springframework.security=WARN
